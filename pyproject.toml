[project]
name = "multi-nlu-data"
version = "0.1.0"
description = "Multi-intent NLU datasets: inspection and conversion to per-intent XML"
readme = "README.md"
authors = [
    { name = "Ben Lambert", email = "blambert@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=5.0.1",
    "fireworks-ai>=1.2.11",
    "typer>=0.27.2",
]

[project.scripts]
multi-nlu = "multi_nlu_data.cli:app"
multi-nlu-convert = "multi_nlu_data.convert:app"

[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "pytest>=9.1.1",
]

[tool.isort]
profile = "black"
